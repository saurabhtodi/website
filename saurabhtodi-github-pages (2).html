  <style>
    :root {
      --bg-primary: #F0EEEB;
      --bg-secondary: #E7E5E1;
      --bg-card: #F8F7F5;
      --bg-card-hover: #FDFCFB;
      --text-primary: #1A1A1A;
      --text-secondary: #4D4D4D;
      --text-muted: #8A8A84;
      --accent: #1A1A1A;
      --accent-light: #333333;
      --accent-dim: rgba(26, 26, 26, 0.06);
      --flagship: #6B7F4E;
      --border: rgba(26, 26, 26, 0.08);
      --border-light: rgba(26, 26, 26, 0.15);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); overflow-x: hidden; }

    ::selection { background: var(--accent); color: #F0EEEB; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #C2C0BB; border-radius: 3px; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grain {
      0%, 100% { transform: translate(0,0) }
      10% { transform: translate(-5%,-10%) }
      30% { transform: translate(3%,-15%) }
      50% { transform: translate(12%,9%) }
      70% { transform: translate(9%,4%) }
      90% { transform: translate(-1%,7%) }
    }

    .grain-overlay {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.02; pointer-events: none; z-index: 9999;
      animation: grain 8s steps(10) infinite;
    }

    /* NAV */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(20px); background: rgba(240, 238, 235, 0.9);
      border-bottom: 1px solid var(--border);
      transition: all 0.4s ease;
    }
    .nav.scrolled { padding: 0.75rem 3rem; }
    .nav-logo {
      font-family: var(--font-display); font-size: 1.25rem; font-weight: 600;
      color: var(--text-primary); letter-spacing: -0.02em; cursor: pointer;
      text-decoration: none; border: none; background: none;
    }
    .nav-logo span { color: var(--flagship); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      color: var(--text-secondary); text-decoration: none; font-size: 0.8rem;
      font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.3s ease; position: relative; cursor: pointer;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0;
      height: 1px; background: var(--accent); transition: width 0.3s ease;
    }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    /* HERO */
    .hero {
      min-height: 100vh; display: flex; align-items: center;
      padding: 8rem 3rem 4rem; position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: 0; right: 0;
      width: 60%; height: 100%;
      background: radial-gradient(ellipse at 80% 30%, rgba(107,127,78,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 200px; background: linear-gradient(to top, var(--bg-primary), transparent);
      pointer-events: none;
    }
    .hero-content { max-width: 1200px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
    .hero-text { animation: fadeUp 1s ease forwards; }
    .hero-eyebrow {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent);
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .hero-eyebrow::before { content: ''; width: 40px; height: 1px; background: var(--accent); }
    .hero-name {
      font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 700; line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 1.5rem; color: var(--text-primary);
    }
    .hero-name em { font-style: italic; color: var(--flagship); font-weight: 500; }
    .hero-subtitle {
      font-size: 1.15rem; color: var(--text-secondary); line-height: 1.7;
      max-width: 500px; font-weight: 300;
    }
    .hero-image-wrap {
      display: flex; justify-content: flex-end; align-items: center;
      animation: fadeIn 1.2s ease 0.3s forwards; opacity: 0;
    }
    .hero-image-container { position: relative; width: 340px; height: 420px; }
    .hero-image-container::before {
      content: ''; position: absolute; top: -12px; right: -12px;
      width: 100%; height: 100%; border: 1px solid var(--accent);
      opacity: 0.3; transition: all 0.5s ease;
    }
    .hero-image-container:hover::before { top: -8px; right: -8px; opacity: 0.6; }
    .hero-image {
      width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(20%) contrast(1.05);
      transition: filter 0.5s ease;
    }
    .hero-image-container:hover .hero-image { filter: grayscale(0%) contrast(1.1); }

    .hero-stats {
      display: flex; gap: 3rem; margin-top: 2.5rem; padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .hero-stat-num {
      font-family: var(--font-display); font-size: 2rem; font-weight: 700;
      color: var(--flagship); line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.1em; margin-top: 0.3rem;
    }

    /* SECTIONS */
    .section { padding: 6rem 3rem; max-width: 1200px; margin: 0 auto; }
    .section-header {
      margin-bottom: 3.5rem; display: flex; align-items: flex-end;
      justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .section-label {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.75rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .section-label::before { content: ''; width: 24px; height: 1px; background: var(--accent); }
    .section-title {
      font-family: var(--font-display); font-size: clamp(1.8rem, 3vw, 2.8rem);
      font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;
    }

    /* ABOUT */
    .about-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 4rem; }
    .about-text { font-size: 1.05rem; line-height: 1.85; color: var(--text-secondary); font-weight: 300; }
    .about-text p + p { margin-top: 1.25rem; }
    .about-text strong { color: var(--text-primary); font-weight: 500; }
    .about-sidebar-title {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1.25rem;
      padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }
    .about-sidebar-item {
      padding: 0.6rem 0; font-size: 0.9rem; color: var(--text-secondary);
      border-bottom: 1px solid var(--border); font-weight: 300;
    }
    .about-sidebar-item span { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .outlet-strip { margin-top: 4rem; padding-top: 3rem; border-top: 1px solid var(--border); }
    .outlet-strip-title {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1.5rem; text-align: center;
    }
    .outlet-logos {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem 3rem; align-items: center;
    }
    .outlet-logo {
      font-family: var(--font-display); font-size: 1rem; color: var(--text-muted);
      font-weight: 500; font-style: italic; opacity: 0.5; transition: opacity 0.3s ease;
      white-space: nowrap; display: flex; align-items: center; gap: 0.5rem;
    }
    .outlet-logo:hover { opacity: 1; color: var(--text-secondary); }
    .outlet-logo:hover img { opacity: 1 !important; }

    /* FILTERS */
    .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.5rem 1.25rem; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: 0.78rem;
      font-family: var(--font-body); cursor: pointer; transition: all 0.3s ease;
      letter-spacing: 0.04em; font-weight: 500;
    }
    .filter-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* WRITING */
    .writing-list { display: flex; flex-direction: column; gap: 0; }
    .writing-item {
      display: grid; grid-template-columns: 120px 1fr auto; gap: 1.5rem;
      padding: 1.4rem 0; border-bottom: 1px solid var(--border);
      align-items: baseline; text-decoration: none;
      transition: all 0.3s ease; cursor: pointer; position: relative;
    }
    .writing-item:first-child { border-top: 1px solid var(--border); }
    .writing-item:hover { background: var(--bg-card); padding-left: 1.5rem; padding-right: 1.5rem; margin: 0 -1.5rem; border-color: var(--border-light); }
    .writing-item:hover + .writing-item { border-top-color: transparent; }
    .writing-date {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
      letter-spacing: 0.05em; padding-top: 0.15rem;
    }
    .writing-outlet {
      font-size: 0.92rem; color: var(--flagship); font-weight: 500;
      margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .outlet-icon {
      width: 24px; height: 24px; border-radius: 3px; object-fit: contain;
      flex-shrink: 0; opacity: 0.85; transition: opacity 0.3s ease;
      background: var(--bg-secondary);
    }
    .writing-item:hover .outlet-icon, .research-card:hover .outlet-icon { opacity: 1; }
    .outlet-icon-lg {
      width: 28px; height: 28px; border-radius: 4px; object-fit: contain;
      flex-shrink: 0; opacity: 0.85; transition: opacity 0.3s ease;
      background: var(--bg-secondary);
    }
    .writing-title {
      font-family: var(--font-display); font-size: 1.05rem; font-weight: 500;
      color: var(--text-primary); line-height: 1.4; letter-spacing: -0.01em;
      transition: color 0.3s ease;
    }
    .writing-item:hover .writing-title { color: var(--flagship); }
    .writing-arrow {
      font-size: 1.1rem; color: var(--text-muted); transition: all 0.3s ease; padding-top: 0.2rem;
    }
    .writing-item:hover .writing-arrow { color: var(--accent); transform: translateX(4px); }
    .writing-note {
      font-size: 0.7rem; color: var(--text-muted); font-style: italic;
      margin-left: 0.5rem; font-family: var(--font-body);
    }
    .show-more-btn {
      margin-top: 2rem; padding: 0.85rem 2rem; background: transparent;
      border: 1px solid var(--border-light); color: var(--text-secondary);
      font-family: var(--font-body); font-size: 0.85rem; cursor: pointer;
      transition: all 0.3s ease; letter-spacing: 0.05em;
    }
    .show-more-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* DIVIDER */
    .section-divider {
      max-width: 1200px; margin: 0 auto; padding: 0 3rem;
      height: 1px; background: linear-gradient(to right, transparent, var(--border-light), transparent);
    }

    /* RESEARCH */
    .research-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .research-card {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 2rem; text-decoration: none; display: block;
      transition: all 0.4s ease; position: relative; overflow: hidden;
      box-shadow: 0 1px 4px rgba(26,26,26,0.04);
    }
    .research-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 3px; height: 0; background: var(--flagship);
      transition: height 0.4s ease;
    }
    .research-card:hover { border-color: var(--border-light); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(26,26,26,0.07); }
    .research-card:hover::before { height: 100%; }
    .research-meta {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
    }
    .research-publisher {
      font-size: 0.88rem; color: var(--flagship); font-weight: 500;
      letter-spacing: 0.03em; display: flex; align-items: center; gap: 0.5rem;
    }
    .research-date { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
    .research-title {
      font-family: var(--font-display); font-size: 1.1rem; font-weight: 500;
      color: var(--text-primary); line-height: 1.4; margin-bottom: 0.75rem;
      letter-spacing: -0.01em; transition: color 0.3s ease;
    }
    .research-card:hover .research-title { color: var(--flagship); }
    .research-summary { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; font-weight: 300; }

    /* CONTACT */
    .contact-section { padding: 6rem 3rem 4rem; max-width: 1200px; margin: 0 auto; text-align: center; }
    .contact-cta {
      font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 500; line-height: 1.4; margin-bottom: 2.5rem; letter-spacing: -0.02em;
    }
    .contact-cta em { font-style: italic; color: var(--flagship); }
    .contact-links { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; }
    .contact-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.85rem 2rem; border: 1px solid var(--border-light);
      text-decoration: none; color: var(--text-secondary); font-size: 0.85rem;
      letter-spacing: 0.04em; transition: all 0.3s ease; font-weight: 500;
    }
    .contact-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .contact-link svg { width: 16px; height: 16px; }

    /* FOOTER */
    .footer {
      padding: 3rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: 0 auto;
    }
    .footer-text { font-size: 0.75rem; color: var(--text-muted); font-weight: 300; }

    /* THEME SWITCHER */
    .theme-switcher {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.75rem;
    }
    .theme-toggle-btn {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border-light);
      background: var(--bg-card); cursor: pointer; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transition: all 0.3s ease; font-size: 1.2rem;
    }
    .theme-toggle-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(0,0,0,0.15); }
    .theme-panel {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 12px; padding: 1.25rem; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      min-width: 260px; animation: fadeUp 0.3s ease;
    }
    .theme-panel-title {
      font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem;
      padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
    }
    .theme-option {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.5rem;
      cursor: pointer; border-radius: 6px; transition: background 0.2s ease;
      border: none; background: none; width: 100%; text-align: left;
    }
    .theme-option:hover { background: var(--accent-dim); }
    .theme-option.active { background: var(--accent-dim); }
    .theme-swatches {
      display: flex; gap: 3px; flex-shrink: 0;
    }
    .theme-swatch {
      width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1);
    }
    .theme-option-name {
      font-family: var(--font-body); font-size: 0.82rem; font-weight: 500;
      color: var(--text-primary);
    }
    .theme-option-desc {
      font-size: 0.7rem; color: var(--text-muted); font-weight: 300; margin-top: 0.1rem;
    }
    .theme-remove-note {
      font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted);
      margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border);
      line-height: 1.4;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .nav { padding: 1rem 1.5rem; }
      .nav-links { gap: 1.5rem; }
      .nav-links a { font-size: 0.7rem; }
      .hero { padding: 7rem 1.5rem 3rem; }
      .hero-content { grid-template-columns: 1fr; gap: 2.5rem; }
      .hero-image-wrap { justify-content: center; order: -1; }
      .hero-image-container { width: 220px; height: 280px; }
      .hero-stats { gap: 2rem; }
      .section { padding: 4rem 1.5rem; }
      .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .writing-item { grid-template-columns: 90px 1fr auto; gap: 1rem; }
      .research-grid { grid-template-columns: 1fr; }
      .contact-section { padding: 4rem 1.5rem; }
      .footer { padding: 2rem 1.5rem; flex-direction: column; gap: 0.5rem; }
    }
    @media (max-width: 600px) {
      .nav-links { gap: 1rem; }
      .nav-links a { font-size: 0.65rem; letter-spacing: 0.08em; }
      .hero-stats { flex-wrap: wrap; gap: 1.5rem; }
      .writing-item { grid-template-columns: 1fr; gap: 0.3rem; }
      .writing-date { font-size: 0.68rem; }
    }

    /* Loading state */
    #root { min-height: 100vh; }
    .site-loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: var(--font-display);
      font-size: 1.2rem; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="root"><div class="site-loading">Loading&hellip;</div></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef } = React;

    // =====================
    // DATA — Edit these arrays to add/remove publications
    // =====================

    const SECTIONS = ["home", "about", "writing", "research", "contact"];

    const OPINION_PIECES = [
      { date: "Feb 2026", outlet: "India's World", title: "SHANTI Act: Nuclear Ambitions Require Nuclear Urgency", url: "https://indiasworld.in/shanti-act-nuclear-ambitions-require-nuclear-urgency/", tier: "featured" },

              </div>
            </div>
            <div className="research-grid">
              {filteredResearch.map((item, i) => (
                <a key={i} className="research-card" href={item.url} target="_blank" rel="noopener noreferrer">
                  <div className="research-meta">
                    <div className="research-publisher">
                      {getOutletIcon(item.publisher) && <img className="outlet-icon-lg" src={getOutletIcon(item.publisher)} alt="" />}
                      {item.publisher}
                    </div>
                    <div className="research-date">{item.date}</div>
                  </div>
                  <div className="research-title">{item.title}</div>
                  <div className="research-summary">{item.summary}</div>
                </a>
              ))}
            </div>
          </section>

          <div className="section-divider" />

          {/* CONTACT */}
          <section className="contact-section" ref={(el) => (sectionRefs.current.contact = el)}>
            <div className="section-label" style={{justifyContent:"center",marginBottom:"1.5rem"}}>Get In Touch</div>
            <div className="contact-cta">Interested in <em>collaboration</em>,<br/>commentary, or research?</div>
            <div className="contact-links">
              <a className="contact-link" href="mailto:saurabhtodi@outlook.com">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13L2 4"/></svg>
                saurabhtodi@outlook.com
              </a>
              <a className="contact-link" href="https://x.com/saurabhtodi" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                @saurabhtodi
              </a>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="footer">
            <div className="footer-text">&copy; 2025 Saurabh Todi. All Rights Reserved.</div>
            <div className="footer-text">Policy Analyst &amp; Researcher</div>
          </footer>

          {/* THEME SWITCHER — Remove this entire block once you've chosen a theme */}
          <div className="theme-switcher">
            {showThemePanel && (
              <div className="theme-panel">
                <div className="theme-panel-title">Choose Color Scheme</div>
                {Object.entries(THEMES).map(([key, theme]) => (
                  <button
                    key={key}
                    className={`theme-option ${activeTheme === key ? "active" : ""}`}
                    onClick={() => handleThemeChange(key)}
                  >
                    <div className="theme-swatches">
                      {theme.swatches.map((c, i) => (
                        <div key={i} className="theme-swatch" style={{background: c}} />
                      ))}
                    </div>
                    <div>
                      <div className="theme-option-name">{theme.name}</div>
                      <div className="theme-option-desc">{theme.desc}</div>
                    </div>
                  </button>
                ))}
                <div className="theme-remove-note">
                  Once you pick a theme, remove this switcher and update the CSS :root variables to match.
                </div>
              </div>
            )}
            <button
              className="theme-toggle-btn"
              onClick={() => setShowThemePanel(!showThemePanel)}
              title="Switch color theme"
            >
              &#127912;
            </button>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
